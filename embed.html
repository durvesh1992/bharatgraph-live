<script>
  const DATA = JSON.parse(document.getElementById('seatdata').textContent);
  const id = decodeURIComponent((location.hash.match(/^#seat\/(.+)$/) || [])[1] || '');
  const s = DATA[id];
  const el = document.getElementById('card');
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if (!s) {
    el.innerHTML = '<div class="empty">Seat not found. Use #seat/&lt;constituency-id&gt;.</div>';
  } else {
    el.innerHTML = `
      <h1>${esc(s.name)}</h1>
      <div class="sub">${esc(s.state)} · ${s.assembly ? 'Assembly' : 'Lok Sabha'} constituency</div>
      <div class="row"><span>Winner (2024)</span><span>${esc(s.mp || '—')}</span></div>
      <div class="row"><span>Party</span><span>${esc(s.party || '—')}</span></div>
      <div class="row"><span>Margin</span><span>${s.margin != null ? s.margin.toLocaleString('en-IN') + ' votes' : '—'}</span></div>
      <div class="row"><span>Turnout</span><span>${s.turnout != null ? s.turnout + '%' : '—'}</span></div>
      <footer><a href="https://durvesh1992.github.io/bharatgraph-live/p/${esc(s.slug)}.html?src=embed" target="_blank" rel="noopener">BharatGraph →</a></footer>`;
  }
</script>
